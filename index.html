<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxymoron Zine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="input-view">
        <h1 class="main-title">オクシモロンの部屋</h1>
        <div class="description">
            <p>相反する言葉をぶつけ合い、まだ名前のない感情の輪郭を削り出す実験室。</p>
            <p>今の気分や、気になる言葉を一つ入力してください。</p>
        </div>
        <input type="text" id="word-input" placeholder="..." autocomplete="off">
    </div>

    <div id="loading-view">
        <p class="loading-text">矛盾を探しています...</p>
    </div>

    <div id="display-view">
        <div id="main-output" class="ink-effect">
            <span id="output-left"></span>
            <span id="output-right"></span>
        </div>
        <div id="orbit-container"></div>
    </div>

    <div id="config-trigger" onclick="toggleConfig(event)"></div>
    <div id="api-config" onclick="event.stopPropagation()">
        <p style="font-size: 10px; margin-bottom: 5px;">Gemini API Key</p>
        <input type="password" id="api-key" placeholder="Paste key here">
    </div>

    <script src="script.js"></script>
</body>
</html>
